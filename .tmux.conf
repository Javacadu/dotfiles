unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

set -g mouse on
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

#--- CATPPUCCIN ---#
set -g @plugin 'catppuccin/tmux#v2.1.3' # See https://github.com/catppuccin/tmux/tags for additional tags
# ...alongside
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g default-terminal "tmux-256color"

# Configure the catppuccin plugin
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set-option -g status-position top
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
#--- CATPPUCCIN ---#

set -g @plugin 'christoomey/vim-tmux-navigator'

#--- SESSION PERSISTENCE ---#
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect: saves/restores sessions, windows, panes, and running programs
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# tmux-continuum: auto-saves every 15min and restores on tmux server start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'iterm'

# Enable tmux-resurrect strategies for pane contents (optional)
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
#--- SESSION PERSISTENCE ---#

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
